name: Refresh Wikipedia structured data
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/sync.py
      - run: python scripts/validate.py
      - run: python scripts/build_sqlite.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki data/quality.json data/db/eason.sqlite sources/wikipedia.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Wikipedia candidates [skip ci]"
            git push
          fi
